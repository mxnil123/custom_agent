services:
  litellm:
    image: ghcr.io/berriai/litellm:main-stable
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:?Copy .env.example to .env and set LITELLM_MASTER_KEY}
      GEMINI_WEB2API_BASE_URL: ${GEMINI_WEB2API_BASE_URL:?Set GEMINI_WEB2API_BASE_URL in .env}
      GEMINI_WEB2API_API_KEY: ${GEMINI_WEB2API_API_KEY:?Set GEMINI_WEB2API_API_KEY in .env}
    volumes:
      - ./litellm_config.yaml:/app/config.yaml:ro
    ports:
      - "127.0.0.1:4000:4000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:4000/health/liveliness', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  agent:
    build:
      context: .
    environment:
      AGENT_API_KEY: ${AGENT_API_KEY:?Set AGENT_API_KEY in .env}
      LITELLM_BASE_URL: http://litellm:4000/v1
      LITELLM_API_KEY: ${LITELLM_MASTER_KEY:?Set LITELLM_MASTER_KEY in .env}
      AGENT_MODEL: agent-main
    depends_on:
      litellm:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
